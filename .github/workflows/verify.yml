name: Verify AIVORA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: '*requirements*.lock'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q
      - run: python scripts/check_secrets.py
      - run: node --check src/aivora/static/app.js
      - run: node --check src/aivora/static/docs.js
      - run: python tests/mcp_e2e.py
      - run: python scripts/evaluate.py
  browser:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/screenshots
          if-no-files-found: ignore
